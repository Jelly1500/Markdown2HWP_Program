name: Build Windows Executable (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      # Nuitka 캐시 위치를 고정(런마다 일관된 경로)하여 Actions 캐시에 적재
      NUITKA_CACHE_DIR: ${{ runner.temp }}\nuitka-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GitHub 호스트 런너에 캐시된 Python을 설치하는 편이 uv로 설치하는 것보다 빠른 경우가 많습니다.
      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: 'pip'   # pip 캐시는 uv와 별개지만, 혹시 pip를 쓰는 보조 단계가 있을 때 도움

      # uv 설치 및 uv 내부 캐시 활성화
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true  # uv의 패키지 캐시를 GitHub Cache로 보존
          # version: "latest"  # 필요 시 uv 버전 고정 가능

      # Nuitka 캐시(컴파일 결과/다운로드 등)를 보존
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt', '**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      # 의존성 설치: uv로 매우 빠르게 설치
      - name: Install dependencies (uv)
        shell: pwsh
        run: |
          uv pip install --system -r requirements.txt

      # Nuitka 빌드
      - name: Build with Nuitka
        shell: pwsh
        run: |
          python -m nuitka `
            --standalone `
            --plugin-enable=pyside6 `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --clang `
            --jobs $env:NUMBER_OF_PROCESSORS `
            --lto=no `
            --nofollow-import-to=PyQt5 `
            --include-package=mistune.plugins `
            --include-package-data=emoji `
            --include-data-dir=md2hwp/new_template=md2hwp/new_template `
            --include-data-file=icon.png=icon.png `
            --output-dir=build_output `
            --output-filename="마크다운 HWP 변환기" `
            run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build_output/run.dist/
