# GitHub Actions 워크플로우의 이름
name: Build Windows Executable (Optimized)

# 이 워크플로우가 언제 실행될지를 정의합니다.
on:
  # 'main' 브랜치에 push 이벤트가 발생했을 때 실행됩니다.

  # 수동으로 Actions 탭에서 직접 실행할 수도 있게 합니다.
  workflow_dispatch:

jobs:
  build:
    # 작업이 실행될 가상 환경을 지정합니다.
    runs-on: windows-latest

    steps:
      # 1. 저장소의 코드를 가상 환경으로 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python 3.9 버전을 설치하고 pip 캐시를 활성화합니다.
      # PySide6와 같은 복잡한 GUI 라이브러리는 안정적인 버전의 Python과 호환성이 더 좋습니다.
      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: 'pip'

      # 3. Nuitka의 C 컴파일 캐시를 설정하여 빌드 속도를 향상시킵니다.
      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: '%APPDATA%\Nuitka'
          key: ${{ runner.os }}-nuitka-cache-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-cache-

      # 4. Python 의존성 패키지를 설치합니다.
      # requirements.txt에 Nuitka가 이미 포함되어 있으므로 별도 설치는 필요 없습니다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 5. Nuitka로 Python 스크립트를 빌드합니다.
      - name: Build with Nuitka
        run: |
          python -m nuitka --standalone --plugin-enable=pyside6 `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            -j $env:NUMBER_OF_PROCESSORS `
            --nofollow-import-to=PyQt5 `
            --include-package=mistune.plugins `
            --include-package-data=emoji `
            --include-data-dir=md2hwp/new_template=md2hwp/new_template `
            --include-data-file=icon.png=icon.png `
            --output-dir=build_output `
            --output-filename="마크다운 HWP 변환기" `
            run.py

      # 6. 빌드 결과물을 업로드합니다.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build_output/run.dist/
