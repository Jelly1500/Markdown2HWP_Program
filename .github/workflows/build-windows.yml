name: Build Windows Executable (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      NUITKA_CACHE_DIR: ${{ github.workspace }}\_nuitka_cache
      UV_LINK_MODE: copy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.10
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.10
          cache: 'pip'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.NUITKA_CACHE_DIR }}
          key: ${{ runner.os }}-nuitka-${{ hashFiles('**/requirements.txt', '**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-nuitka-

      - name: Install dependencies (uv)
        shell: pwsh
        run: |
          uv pip install --system -r requirements.txt

      - name: Build with Nuitka
        shell: pwsh
        run: |
          # 안전한 병렬 값 설정 (환경변수 없으면 2)
          $jobs = if ($env:NUMBER_OF_PROCESSORS) { [int]$env:NUMBER_OF_PROCESSORS } else { 2 }

          python -m nuitka `
            --standalone `
            --plugin-enable=pyside6 `
            --assume-yes-for-downloads `
            --windows-console-mode=disable `
            --clang `
            --jobs=$jobs `
            --lto=no `
            --nofollow-import-to=PyQt5 `
            --include-package=mistune.plugins `
            --include-package-data=emoji `
            --include-data-dir=md2hwp/new_template=md2hwp/new_template `
            --include-data-file=icon.png=icon.png `
            --output-dir=build_output `
            --output-filename="마크다운 HWP 변환기" `
            run.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Build
          path: build_output/run.dist/
